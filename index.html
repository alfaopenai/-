<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אלפא פוקר - מחשבון הסתברויות פוקר מתקדם</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <div class="app-shell">
            <div class="app-main">
                <header class="top-toolbar" role="banner">
                    <div class="top-toolbar__intro">
                        <p class="toolbar-eyebrow">אלפא פוקר</p>
                        <div class="toolbar-status" aria-live="polite">
                            <div class="toolbar-select">
                                <button id="player-count-label" type="button" class="toolbar-chip toolbar-chip--button" aria-haspopup="menu" aria-expanded="false" aria-controls="player-count-menu">9 שחקנים</button>
                                <div id="player-count-menu" class="toolbar-choice-menu" role="menu" aria-hidden="true"></div>
                            </div>
                            <div class="toolbar-select">
                                <button id="game-type-label" type="button" class="toolbar-chip toolbar-chip--button toolbar-chip--muted" aria-haspopup="menu" aria-expanded="false" aria-controls="game-type-menu">טקסס הולדם No-Limit</button>
                                <div id="game-type-menu" class="toolbar-choice-menu" role="menu" aria-hidden="true"></div>
                            </div>
                        </div>
                    </div>

                    <div class="top-toolbar__controls" role="toolbar" aria-label="ניהול שולחן">
                        <div class="top-toolbar__group top-toolbar__group--primary" role="group" aria-label="פעולות מהירות">
                            <button id="read-gg-table" type="button" class="toolbar-action toolbar-action--gg" data-toolbar-action="read-gg-table">קרא שולחן GG</button>
                            <button id="deal-random" type="button" class="toolbar-action" data-toolbar-action="deal-random">חלוקה אקראית</button>
                            <button id="clear-all" type="button" class="toolbar-action toolbar-action--quiet" data-toolbar-action="clear-all">נקה שולחן</button>
                        </div>
                        <div id="gg-reader-status" class="gg-reader-status" data-status="idle" aria-live="polite">
                            <span id="gg-reader-status-text">GG מנותק</span>
                            <span id="gg-reader-confidence" class="gg-reader-confidence"></span>
                            <button id="gg-reader-stop" type="button" class="gg-reader-stop" hidden>עצור</button>
                            <button id="gg-reader-history-toggle" type="button" class="gg-reader-history-toggle">היסטוריה</button>
                        </div>
                    </div>
                </header>

                <section id="gg-reader-history" class="gg-reader-history" hidden aria-hidden="true">
                    <header class="gg-reader-history__header">
                        <h2>היסטוריית GG</h2>
                        <button id="gg-reader-history-download" type="button">הורד JSON</button>
                    </header>
                    <ol id="gg-reader-history-list" class="gg-reader-history__list"></ol>
                </section>

                <section id="calculator-view" class="view-panel view-panel--calculator" aria-hidden="false">
                    <button id="solver-settings-toggle" type="button" class="solver-toggle solver-settings-toggle" aria-controls="solver-controls" aria-expanded="false" hidden aria-hidden="true">
                        פתח מסך סולבר GTO
                    </button>

                    <section id="solver-controls" class="solver-panel solver-controls" hidden aria-hidden="true">
                        <header class="solver-panel__header">
                            <h2>סולבר GTO</h2>
                            <p>הגדירו את פרטי הסיטואציה כדי לחשב קווי משחק מאוזנים לשולחן הנוכחי.</p>
                        </header>

                        <div class="solver-panel__grid">
                            <label class="solver-field">
                                <span>גודל קופה (BB)</span>
                                <input id="solver-pot-size" type="number" min="0" step="0.5" value="10">
                            </label>
                            <label class="solver-field">
                                <span>סטאק אפקטיבי (BB)</span>
                                <input id="solver-effective-stack" type="number" min="0" step="0.5" value="100">
                            </label>
                            <label class="solver-field">
                                <span>גודל הימור נוכחי (%)</span>
                                <input id="solver-bet-size" type="number" min="5" max="300" step="5" value="75">
                            </label>
                            <label class="solver-field">
                                <span>פרופיל יריב</span>
                                <select id="solver-opponent-profile">
                                    <option value="balanced">מאוזן</option>
                                    <option value="tight">טייט</option>
                                    <option value="loose">לוס</option>
                                    <option value="aggressive">אגרסיבי</option>
                                </select>
                            </label>
                            <label class="solver-field">
                                <span>מספר איטרציות</span>
                                <input id="solver-iterations" type="number" min="1000" step="1000" value="20000">
                            </label>
                        </div>

                        <div class="solver-panel__actions solver-actions">
                            <button id="solver-run" type="button" class="primary">הרץ סימולציה</button>
                            <button id="solver-reset" type="button" class="tertiary">איפוס פרמטרים</button>
                        </div>
                    </section>

                    <section id="solver-results" class="solver-results" hidden aria-hidden="true" aria-live="polite">
                        <div class="solver-results__placeholder solver-placeholder">
                            <p>בחרו קלפים והגדירו פרמטרים כדי להפעיל את הסולבר.</p>
                        </div>
                    </section>

                    <div class="calculator-layout">
                        <section class="table-wrapper">
                            <div class="felt">
                                <div class="table-surface">
                                    <div id="table" class="table">
                                        <div class="board-area">
                                            <div id="table-pot" class="table-pot" aria-live="polite" aria-atomic="true">קופה: 0</div>
                                            <div id="board-cards" class="board-cards"></div>
                                        </div>
                                    </div>
                                </div>

                                <aside class="deck-area">
                                    <section id="errors" class="messages" aria-live="polite"></section>
                                </aside>
                            </div>
                        </section>

                        <section id="live-game-panel" class="live-game" hidden aria-hidden="true">
                            <header class="live-game__header">
                                <h2 class="live-game__title">משחק חי</h2>
                                <button id="live-game-exit" type="button" class="live-game__exit">סיום משחק</button>
                            </header>
                            <div id="live-game-status" class="live-game__status" aria-live="polite"></div>
                            <div class="live-game__actions" role="group" aria-label="בחירת פעולה">
                                <button id="live-action-fold" type="button" class="live-game__button live-game__button--fold">קיפול</button>
                                <button id="live-action-check" type="button" class="live-game__button">צ'ק / קול</button>
                                <button id="live-action-raise" type="button" class="live-game__button live-game__button--raise">רייז</button>
                            </div>
                            <div id="live-action-raise-options" class="live-game__raise-options" role="group" aria-label="אפשרויות רייז" hidden></div>
                            <div class="live-game__next">
                                <button id="live-action-next" type="button" class="live-game__button live-game__button--primary" hidden>המשך</button>
                            </div>
                            <div id="live-game-log" class="live-game__log" aria-live="polite"></div>
                        </section>

                        <section id="results" class="results" aria-live="polite"></section>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="deck-overlay" class="deck-overlay" hidden role="dialog" aria-modal="true" aria-label="בחירת קלף">
        <div class="deck-overlay__inner">
            <header class="deck-overlay__header">
                <span class="deck-overlay__title">בחרו קלף</span>
                <button id="deck-overlay-close" type="button" class="deck-overlay__close" aria-label="סגירת חפיסה">×</button>
            </header>
            <div class="deck-overlay__body">
                <div id="deck" class="deck-strip" dir="ltr"></div>
            </div>
        </div>
        <div class="deck-overlay__arrow" aria-hidden="true"></div>
    </div>

    <script src="solver/index.js"></script>
    <script src="solver/strategy/singleStreetCfr.js"></script>
    <script src="solver/strategy/texasCfr.js"></script>
    <script src="solver/strategy/pycfrAdapter.js"></script>
    <script src="solver/strategy/postflopWasm.js"></script>
    <script src="app.js"></script>
</body>
</html>
